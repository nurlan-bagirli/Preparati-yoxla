<!doctype html><html lang="az"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparatı Yoxla</title><style>body{font-family:system-ui;margin:0;background:#f4f7f5;color:#17211d}header{background:#086447;color:#fff;padding:28px 16px}main{max-width:900px;margin:auto;padding:20px 16px}.search{display:flex;gap:8px;margin-top:18px}.search input{flex:1;padding:14px;border:0;border-radius:10px;font-size:16px}.search button{padding:14px;border:0;border-radius:10px}.card{background:white;border:1px solid #dce5e0;border-radius:14px;padding:16px;margin:12px 0}.ok{color:#087443;font-weight:700}.warn{background:#fff0dc;padding:14px;border-radius:12px}</style><header><main><h1>🌿 Preparatı Yoxla</h1><div>01.09.2026 AQTA reyestri</div><div class="search"><input id=q placeholder="Preparat adı, qeydiyyat №, təsiredici maddə..."><button onclick=go>🔎 Yoxla</button></div></main></header><main><div id=out>Yüklənir…</div></main><script>let d=[];fetch('data.json').then(r=>r.json()).then(x=>{d=x;out.innerHTML='<p><b>'+d.length+'</b> qeyd bazaya yükləndi. Məsələn <b>Sunstar</b> yazın.</p>'}).catch(()=>out.innerHTML='<div class=warn>data.json hələ yerləşdirilməyib.</div>');function go(){let q=document.getElementById('q').value.toLowerCase().trim();let a=d.filter(x=>(x.product+' '+x.active+' '+x.manufacturer+' '+x.regNo).toLowerCase().includes(q)).slice(0,20);out.innerHTML=a.length?a.map(x=>`<div class=card><h2>${x.product}</h2><div>${x.active||'—'}</div><p>Qeydiyyat №: <b>${x.regNo||'—'}</b><br>Bitmə: <b>${x.regExpiry||'—'}</b></p><div class=ok>${x.status||''}</div><small>AQTA PDF səhifəsi: ${x.pdfPage||'—'}</small></div>`).join(''):'<div class=warn>🟠 Dəqiq uyğunluq tapılmadı.</div>'}</script></html>
